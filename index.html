<script>
    // логика тултипов — без Jekyll, чистый JS
    (function() {
        let tooltip = null;
        let activeHotspot = null;
        let hideTimer = null;

        function getTooltip() {
            if (!tooltip) {
                const div = document.createElement('div');
                div.className = 'tooltip-custom';
                div.style.opacity = '0';
                document.body.appendChild(div);
                tooltip = div;
            }
            return tooltip;
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function showTooltip(name, desc, mouseX, mouseY) {
            const tip = getTooltip();
            tip.innerHTML = `<strong>🔌 ${escapeHTML(name)}</strong><span>${escapeHTML(desc)}</span>`;

            let left = mouseX + 18;
            let top = mouseY - 38;
            const rect = tip.getBoundingClientRect();
            const winW = window.innerWidth;
            const winH = window.innerHeight;

            if (left + rect.width > winW - 12) left = mouseX - rect.width - 18;
            if (top + rect.height > winH - 18) top = mouseY - rect.height - 12;
            if (left < 6) left = 12;
            if (top < 6) top = 10;

            tip.style.left = left + 'px';
            tip.style.top = top + 'px';
            tip.style.opacity = '1';
        }

        function hideTooltip() {
            if (tooltip) tooltip.style.opacity = '0';
            activeHotspot = null;
        }

        const hotspots = document.querySelectorAll('.hotspot');

        hotspots.forEach(zone => {
            const nameAttr = zone.getAttribute('data-name') || 'порт';
            const descAttr = zone.getAttribute('data-desc') || 'стандартный интерфейс';

            zone.addEventListener('mouseenter', (e) => {
                if (hideTimer) clearTimeout(hideTimer);
                activeHotspot = zone;
                showTooltip(nameAttr, descAttr, e.clientX, e.clientY);
            });

            zone.addEventListener('mousemove', (e) => {
                if (activeHotspot === zone && tooltip && tooltip.style.opacity === '1') {
                    let left = e.clientX + 18;
                    let top = e.clientY - 38;
                    const rect = tooltip.getBoundingClientRect();
                    const winW = window.innerWidth;
                    const winH = window.innerHeight;
                    if (left + rect.width > winW - 12) left = e.clientX - rect.width - 18;
                    if (top + rect.height > winH - 18) top = e.clientY - rect.height - 12;
                    if (left < 6) left = 12;
                    if (top < 6) top = 10;
                    tooltip.style.left = left + 'px';
                    tooltip.style.top = top + 'px';
                }
            });

            zone.addEventListener('mouseleave', () => {
                if (activeHotspot === zone) {
                    hideTimer = setTimeout(() => hideTooltip(), 20);
                }
            });
        });

        document.body.addEventListener('mousemove', (e) => {
            let overAny = false;
            for (let z of hotspots) {
                const rect = z.getBoundingClientRect();
                if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
                    overAny = true;
                    break;
                }
            }
            if (!overAny && tooltip && tooltip.style.opacity === '1') {
                if (hideTimer) clearTimeout(hideTimer);
                hideTimer = setTimeout(() => hideTooltip(), 15);
            } else if (overAny && hideTimer) {
                clearTimeout(hideTimer);
            }
        });

        window.addEventListener('scroll', () => hideTooltip());
        window.addEventListener('resize', () => hideTooltip());
    })();
</script>
