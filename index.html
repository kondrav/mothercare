<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Gigabyte B760 GAMING X GEN5 | Задняя панель</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: linear-gradient(145deg, #14161a 0%, #1b1e24 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
            padding: 2rem 1.5rem;
        }

        .motherboard-card {
            max-width: 1400px;
            width: 100%;
            background: #0a0c12;
            border-radius: 2rem;
            box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.7);
            padding: 1.6rem 1.8rem 1.8rem;
        }

        .header-info {
            text-align: center;
            margin-bottom: 1.6rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 0.9rem;
        }
        .header-info h1 {
            font-size: 1.9rem;
            font-weight: 600;
            background: linear-gradient(135deg, #e6e9f0, #b4bed4);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .header-info p {
            color: #8e98b0;
            margin-top: 0.4rem;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }
        .badge {
            background: #1e222b;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-size: 0.7rem;
            color: #b9c7e6;
        }

        .board-image-container {
            position: relative;
            display: flex;
            justify-content: center;
            border-radius: 1.5rem;
            overflow: hidden;
            background: #010101;
            box-shadow: 0 12px 28px -8px black;
        }

        .board-img {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none; /* чтобы клики проходили сквозь картинку к точкам */
        }

        /* невидимые области-ловушки для мыши */
        .hotspot {
            position: absolute;
            width: 68px;
            height: 24px;
            background: transparent;
            cursor: help;
            transform: translate(-50%, -50%);
            z-index: 30;
        }
        /* наведение не должно ничего менять визуально */
        .hotspot:hover {
            background: transparent;
        }

        /* всплывающая подсказка */
        .tooltip-custom {
            position: fixed;
            background: rgba(10, 13, 20, 0.97);
            backdrop-filter: blur(16px);
            border-left: 5px solid #f5b042;
            border-radius: 22px;
            padding: 0.9rem 1.4rem;
            color: #f2f5fc;
            max-width: 380px;
            min-width: 260px;
            font-size: 0.9rem;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.6);
            z-index: 2000;
            pointer-events: none;
            line-height: 1.5;
            transition: opacity 0.1s ease;
        }
        .tooltip-custom strong {
            display: block;
            font-size: 1.05rem;
            margin-bottom: 8px;
            color: #ffda88;
        }
        .tooltip-custom span {
            display: block;
            font-size: 0.82rem;
            color: #dee5fc;
        }

        /* легенда внизу */
        .legend-note {
            margin-top: 1.6rem;
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
            font-size: 0.75rem;
            color: #8f9bb3;
            background: rgba(0, 0, 0, 0.35);
            padding: 0.6rem 1rem;
            border-radius: 2rem;
        }
        .legend-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        @media (max-width: 800px) {
            .motherboard-card { padding: 1rem; }
            .hotspot { width: 52px; height: 22px; }
            .tooltip-custom { max-width: 290px; padding: 0.7rem 1rem; }
            .header-info h1 { font-size: 1.4rem; }
        }
        @media (max-width: 550px) {
            .hotspot { width: 44px; height: 20px; }
        }
    </style>
</head>
<body>
<div class="motherboard-card">
    <div class="header-info">
        <h1>🔌 Gigabyte B760 GAMING X GEN5</h1>
        <p><span class="badge">LGA 1700 · PCIe 5.0 · DDR5</span> <span class="badge">Задняя панель I/O</span></p>
        <p style="font-size: 0.75rem; margin-top: 4px;">наведи на область разъёма — появится описание</p>
    </div>

    <div class="board-image-container">
        <!-- само фото платы, должно лежать рядом как 1.webp -->
        <img class="board-img" src="1.webp" alt="Gigabyte B760 GAMING X GEN5" onerror="this.src='https://via.placeholder.com/1300x850?text=Gigabyte+B760+GAMING+X+GEN5'">

        <!-- координаты точек подобраны вручную по кликам на изображении -->

        <div class="hotspot" style="top: 53.43%; left: 11.17%;"
             data-name="USB 2.0 Type-A"
             data-desc="Скорость до 480 Мбит/с. Для мыши, клавы, принтера, веб-камеры. Ток до 500 мА, горячее подключение, драйверы не нужны."></div>

        <div class="hotspot" style="top: 58.95%; left: 11.26%;"
             data-name="USB 2.0 Type-A"
             data-desc="Второй USB 2.0 (480 Мбит/с). Подойдёт для флешек, MFP, кардридера. Без проблем работает с удлинителями до 5 метров."></div>

        <div class="hotspot" style="top: 50.5%; left: 21.52%;"
             data-name="Антенна Wi‑Fi / Bluetooth"
             data-desc="Разъём RP‑SMA для внешней антенны. Улучшает приём и дальность Wi‑Fi (2.4/5/6 ГГц) и Bluetooth. Без антенны сигнал слабее."></div>

        <div class="hotspot" style="top: 53.95%; left: 33.24%;"
             data-name="USB 2.0 Type-A"
             data-desc="480 Мбит/с. Идеален для клавиатуры, мыши, MIDI‑контроллеров, USB‑хабов. Стабильная работа без нареканий."></div>

        <div class="hotspot" style="top: 59.21%; left: 32.9%;"
             data-name="USB 2.0 Type-A"
             data-desc="Четвёртый USB 2.0. Подключай принтер, сканер, внешний привод. Полная совместимость со старой периферией."></div>

        <div class="hotspot" style="top: 52.14%; left: 47.64%;"
             data-name="DisplayPort 1.2"
             data-desc="Разрешение до 4K@60Гц (4096x2304). Аудио 8 каналов, FreeSync, поддержка цепочек Daisy Chain до 2 мониторов."></div>

        <div class="hotspot" style="top: 58.95%; left: 48.33%;"
             data-name="HDMI 2.1"
             data-desc="4K@60Гц, HDR10+, eARC. Подходит для телевизоров, проекторов, консолей. Полная цветопередача 10‑12 бит."></div>

        <div class="hotspot" style="top: 53.78%; left: 59.97%;"
             data-name="USB 3.2 Gen 1 Type-A (синий)"
             data-desc="Скорость 5 Гбит/с. В 10 раз быстрее USB 2.0. Для внешних SSD, флешек, видеозахвата. Ток до 900 мА."></div>

        <div class="hotspot" style="top: 58.78%; left: 60.66%;"
             data-name="USB Type‑C 3.2 Gen 2"
             data-desc="Симметричный разъём, 10 Гбит/с. DisplayPort Alt Mode (видеовыход), зарядка до 15 Вт. Для док‑станций и быстрых SSD."></div>

        <div class="hotspot" style="top: 47.22%; left: 73.76%;"
             data-name="2.5 GbE LAN (RJ‑45)"
             data-desc="Сетевой порт 2500 Мбит/с. Автоопределение кабеля, Wake‑on‑LAN. Для игр, NAS и быстрой раздачи файлов."></div>

        <div class="hotspot" style="top: 53.86%; left: 74.45%;"
             data-name="Q‑Flash Plus (USB для BIOS)"
             data-desc="Обновление BIOS без CPU, памяти и видеокарты. Вставь флешку с прошивкой и нажми кнопку на панели."></div>

        <div class="hotspot" style="top: 58.78%; left: 74.1%;"
             data-name="USB 3.2 Gen 1 Type-A"
             data-desc="Ещё один синий порт на 5 Гбит/с. Для внешних накопителей, гарнитур, карт захвата видео."></div>

        <!-- аудиоразъёмы 7.1 -->
        <div class="hotspot" style="top: 43.86%; left: 85.74%;"
             data-name="Аудио: центр / сабвуфер (оранж)"
             data-desc="3.5 мм для центрального канала и сабвуфера в системах 5.1 или 7.1. Работает с зелёным и чёрным выходами."></div>

        <div class="hotspot" style="top: 50.67%; left: 85.74%;"
             data-name="Аудио: тыл (чёрный)"
             data-desc="Тыловые колонки для объёмного звука 5.1/7.1. Создаёт эффект присутствия в играх и кино."></div>

        <div class="hotspot" style="top: 57.31%; left: 85.74%;"
             data-name="Аудио: боковые каналы (серый)"
             data-desc="Для систем 7.1. Добавляет боковые эффекты, расширяет звуковую сцену."></div>

        <div class="hotspot" style="top: 43.95%; left: 93.07%;"
             data-name="Line In (синий)"
             data-desc="Линейный вход для плеера, синтезатора, телевизора. Запись звука 24 бит / 192 кГц."></div>

        <div class="hotspot" style="top: 50.5%; left: 93.16%;"
             data-name="Line Out (зелёный)"
             data-desc="Основной выход на наушники или активные колонки. SNR до 110 дБ, качественный звук."></div>

        <div class="hotspot" style="top: 57.05%; left: 93.07%;"
             data-name="Mic In (розовый)"
             data-desc="Вход для микрофона или гарнитуры. Усиление до 32 дБ, шумоподавление."></div>
    </div>

    <div class="legend-note">
        <div class="legend-item">⚡ наведи курсор на область порта</div>
        <div class="legend-item">🔍 все разъёмы: USB, видео, LAN 2.5G, аудио 7.1, Wi‑Fi</div>
    </div>
</div>

<script>
    // --- простая логика работы тултипов без фреймворков ---
    (function() {
        let tooltip = null;          // сам элемент подсказки
        let activeHotspot = null;    // на какой точке сейчас мышь
        let hideTimer = null;        // таймер для плавного скрытия

        // создать тултип один раз
        function getTooltip() {
            if (!tooltip) {
                const div = document.createElement('div');
                div.className = 'tooltip-custom';
                div.style.opacity = '0';
                document.body.appendChild(div);
                tooltip = div;
            }
            return tooltip;
        }

        // защита от спецсимволов в тексте
        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // показать подсказку с текстом у курсора
        function showTooltip(name, desc, mouseX, mouseY) {
            const tip = getTooltip();
            tip.innerHTML = `<strong>🔌 ${escapeHTML(name)}</strong><span>${escapeHTML(desc)}</span>`;

            let left = mouseX + 18;
            let top = mouseY - 38;
            const rect = tip.getBoundingClientRect();
            const winW = window.innerWidth;
            const winH = window.innerHeight;

            // не вылезать за правый край
            if (left + rect.width > winW - 12) {
                left = mouseX - rect.width - 18;
            }
            // не вылезать за нижний край
            if (top + rect.height > winH - 18) {
                top = mouseY - rect.height - 12;
            }
            // отступы от границ
            if (left < 6) left = 12;
            if (top < 6) top = 10;

            tip.style.left = left + 'px';
            tip.style.top = top + 'px';
            tip.style.opacity = '1';
        }

        function hideTooltip() {
            if (tooltip) tooltip.style.opacity = '0';
            activeHotspot = null;
        }

        // все интерактивные области
        const hotspots = document.querySelectorAll('.hotspot');

        hotspots.forEach(zone => {
            const nameAttr = zone.getAttribute('data-name') || 'порт';
            const descAttr = zone.getAttribute('data-desc') || 'стандартный интерфейс';

            // при заходе мыши на зону
            zone.addEventListener('mouseenter', (e) => {
                if (hideTimer) clearTimeout(hideTimer);
                activeHotspot = zone;
                showTooltip(nameAttr, descAttr, e.clientX, e.clientY);
            });

            // при движении внутри зоны — обновляем позицию
            zone.addEventListener('mousemove', (e) => {
                if (activeHotspot === zone && tooltip && tooltip.style.opacity === '1') {
                    let left = e.clientX + 18;
                    let top = e.clientY - 38;
                    const rect = tooltip.getBoundingClientRect();
                    const winW = window.innerWidth;
                    const winH = window.innerHeight;
                    if (left + rect.width > winW - 12) left = e.clientX - rect.width - 18;
                    if (top + rect.height > winH - 18) top = e.clientY - rect.height - 12;
                    if (left < 6) left = 12;
                    if (top < 6) top = 10;
                    tooltip.style.left = left + 'px';
                    tooltip.style.top = top + 'px';
                }
            });

            // при уходе с зоны — скрываем с небольшим таймером, чтобы не моргало
            zone.addEventListener('mouseleave', () => {
                if (activeHotspot === zone) {
                    hideTimer = setTimeout(() => {
                        hideTooltip();
                    }, 20);
                }
            });
        });

        // глобальный пинок: если мышь ушла вообще со всех зон — прячем подсказку
        document.body.addEventListener('mousemove', (e) => {
            let overAny = false;
            for (let z of hotspots) {
                const rect = z.getBoundingClientRect();
                if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
                    overAny = true;
                    break;
                }
            }
            if (!overAny && tooltip && tooltip.style.opacity === '1') {
                if (hideTimer) clearTimeout(hideTimer);
                hideTimer = setTimeout(() => hideTooltip(), 15);
            } else if (overAny && hideTimer) {
                clearTimeout(hideTimer);
            }
        });

        // при скролле или изменении размера окна скрываем подсказку
        window.addEventListener('scroll', () => hideTooltip());
        window.addEventListener('resize', () => hideTooltip());
    })();
</script>
</body>
</html>
